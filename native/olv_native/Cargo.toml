[package]
name = "olv_native"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Optional Rust (PyO3) cores for onegpu-longvideo: WER alignment and the voice RMS envelope."

[lib]
name = "olv_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py310"] }

[profile.release]
lto = true
codegen-units = 1
