[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onegpu-longvideo"
version = "0.1.0"
description = "Long one-shot talking-head and cinematic video with a joint audio-video DiT on one consumer GPU (ComfyUI driver, streaming upscaler, two-stage QA)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyyaml>=6"]

[project.optional-dependencies]
gpu = ["torch>=2.3", "spandrel>=0.4"]
qa = ["faster-whisper>=1.0", "opencv-python-headless>=4.8", "soundfile>=0.12", "librosa>=0.10"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
olv = "onegpu_longvideo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E701", "E702", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
