# Talking-head explainer: one presenter to camera, continuous speech, 10-30 s single shots.
# All numbers come from _base.yaml (the base is the talking-head profile). Overrides only.
# Angle plan: 2-3 set-up changes per 3 min at topic shifts, bookend on set-up A (R-AN1, R-AN2). Jump cuts keep the angle (R-ED2).
description: "Talking-head explainer (YouTube style)"
planner:
  angles:
    ref_prompts:   # edit prompts for the set-up reference stills (made from the identity still before the first clip of that set-up)
      B: "same person, same room and light, seen from a second camera about 30 degrees to the {side}: a clear three-quarter view, torso angled away from the lens, head turned back to the lens; the perspective change is obvious"
      C: "same person, same room and light, camera moved back: a wide frontal shot, waist up, the whole desk and much more of the room visible"
  hook: {first_line_by_s: 5}        # say what the video covers within about 5 s (R-HK1)
  gestures:
    rest: "rests both hands on the desk and stays still"
